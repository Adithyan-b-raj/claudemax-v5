<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrock VPS - Key Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid #2a2a2a;
    }

    .card h2 {
      font-size: 1rem;
      color: #888;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      min-width: 150px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.3rem;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: #4a9eff;
    }

    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #4a9eff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #3a8eef;
    }

    .btn-danger {
      background: #ff4a4a;
      color: #fff;
    }

    .btn-danger:hover {
      background: #e03a3a;
    }

    .btn-secondary {
      background: #333;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .key-list {
      margin-top: 1rem;
    }

    .key-item {
      background: #0f0f0f;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .key-info {
      width: 100%;
    }

    .key-name {
      font-weight: 600;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    .key-ip {
      font-size: 0.78rem;
      margin-bottom: 0.3rem;
    }

    .key-meta {
      font-size: 0.82rem;
      color: #666;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-bar-wrap {
      margin-top: 0.3rem;
      margin-bottom: 0.3rem;
      background: #222;
      border-radius: 4px;
      height: 6px;
      width: 220px;
      max-width: 100%;
    }

    .token-bar {
      height: 6px;
      border-radius: 4px;
      background: #4a9eff;
      transition: width 0.3s;
    }

    .token-bar.warn {
      background: #ffaa4a;
    }

    .token-bar.full {
      background: #ff4a4a;
    }

    .edit-limit-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .edit-limit-row input {
      width: 120px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }

    .token-breakdown {
      margin-top: 0.15rem;
      font-size: 0.78rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .token-breakdown span {
      white-space: nowrap;
    }

    .token-in {
      color: #4a9eff;
    }

    .token-out {
      color: #4aff9e;
    }

    .token-cache {
      color: #ffaa4a;
    }

    .cost-label {
      color: #d4af37;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .refill-label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.2rem;
      white-space: nowrap;
    }

    .history-panel {
      margin-top: 0.2rem;
      border-top: 1px solid #2a2a2a;
      padding-top: 0.6rem;
    }

    .history-panel .hist-title {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .history-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.78rem;
      color: #777;
      padding: 0.3rem 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .history-row:last-child {
      border-bottom: none;
    }

    .hist-win {
      color: #888;
      white-space: nowrap;
    }

    .hist-in {
      color: #4a9eff;
      white-space: nowrap;
    }

    .hist-out {
      color: #4aff9e;
      white-space: nowrap;
    }

    .hist-cache {
      color: #ffaa4a;
      white-space: nowrap;
    }

    .hist-cost {
      color: #d4af37;
      font-weight: 600;
      white-space: nowrap;
    }

    .key-value {
      font-family: monospace;
      font-size: 0.82rem;
      background: #1a1a1a;
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      color: #4a9eff;
      word-break: break-all;
      margin-top: 0.3rem;
    }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      width: 100%;
    }

    .actions button {
      flex: 0 0 auto;
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      body {
        padding: 1rem;
      }

      .actions button {
        flex: 1 1 auto;
      }
    }

    .login-form {
      max-width: 400px;
      margin: 4rem auto;
    }

    .hidden {
      display: none;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .alert-success {
      background: #1a3a1a;
      color: #4aff4a;
    }

    .alert-error {
      background: #3a1a1a;
      color: #ff4a4a;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 2rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="login-view" class="login-form">
      <div class="card">
        <h2>Admin Login</h2>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label>Admin Secret</label>
          <input type="password" id="admin-secret" placeholder="Enter admin secret">
        </div>
        <button class="btn-primary" onclick="login()" style="width: 100%;">Login</button>
      </div>
    </div>

    <div id="dashboard-view" class="hidden">
      <h1>Bedrock VPS - Key Management</h1>

      <div id="alert" class="alert hidden"></div>

      <div class="card">
        <h2>Create New API Key</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="key-name" placeholder="my-app">
          </div>
          <div class="form-group">
            <label>Expires In (days)</label>
            <input type="number" id="key-days" value="7" min="1" max="365">
          </div>
          <div class="form-group">
            <label>Token Limit (0 = unlimited)</label>
            <input type="number" id="key-token-limit" value="0" min="0">
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end; gap: 0.8rem;">
            <div>
              <label style="font-size:0.85rem; color:#aaa; display:block; margin-bottom:0.3rem;">Refill</label>
              <select id="key-refill"
                style="background:#1a1a2e; color:#e0e0e0; border:1px solid #333; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;">
                <option value="none">None</option>
                <option value="5h">Every 5h IST</option>
                <option value="daily">Daily 00:00 IST</option>
              </select>
            </div>
            <button class="btn-primary" onclick="createKey()">Create Key</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Active Keys</h2>
        <div id="key-list" class="key-list">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let adminToken = localStorage.getItem('adminToken') || '';

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: {
          'Authorization': `Bearer ${adminToken}`,
          'Content-Type': 'application/json',
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert alert-${type}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    async function login() {
      adminToken = document.getElementById('admin-secret').value;
      const data = await api('GET', '/admin/keys');
      if (data.error) {
        showAlert('Invalid admin secret', 'error');
        return;
      }
      localStorage.setItem('adminToken', adminToken);
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      loadKeys();
    }

    async function loadKeys() {
      const data = await api('GET', '/admin/keys');
      if (data.error) {
        document.getElementById('key-list').innerHTML = '<div class="empty">Error loading keys</div>';
        return;
      }
      if (!data.keys || data.keys.length === 0) {
        document.getElementById('key-list').innerHTML = '<div class="empty">No keys yet</div>';
        return;
      }
      document.getElementById('key-list').innerHTML = data.keys.map(k => {
        const used = k.tokensUsed ?? 0;
        const limit = k.tokenLimit ?? 0;
        const input = k.inputTokens ?? 0;
        const output = k.outputTokens ?? 0;
        const cache = k.cacheTokens ?? 0;
        const totalUsed = k.totalTokensUsed ?? 0;
        const totalIn = k.totalInputTokens ?? 0;
        const totalOut = k.totalOutputTokens ?? 0;
        const totalCache = k.totalCacheTokens ?? 0;
        const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
        const barClass = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : '';
        const tokenText = limit > 0
          ? `${used.toLocaleString()} / ${limit.toLocaleString()} tokens (this period)`
          : `${used.toLocaleString()} tokens this period (unlimited)`;
        const refillIntervalLabel = k.refillInterval === 'daily' ? 'daily 00:00' : 'every 5h';
        const windowLabel = k.refillInterval === 'daily' ? 'Daily Window' : '5h Window';
        const periodCost = calcCost(input, output, cache);
        const lifetime = calcCost(totalIn, totalOut, totalCache);
        const breakdown = (input > 0 || output > 0 || cache > 0)
          ? `<div class="token-breakdown">
               <span style="color:#aaa; font-size:0.75rem;">${windowLabel}:</span>
               <span class="token-in">In: ${input.toLocaleString()}</span>
               <span class="token-out">Out: ${output.toLocaleString()}</span>
               ${cache > 0 ? `<span class="token-cache">Cache: ${cache.toLocaleString()}</span>` : ''}
               <span class="cost-label">≈ $${periodCost}</span>
             </div>`
          : '';
        const lifetimeBreakdown = totalUsed > 0
          ? `<div class="token-breakdown" style="margin-top:0.15rem;">
               <span style="color:#aaa; font-size:0.75rem;">All-Time Total:</span>
               <span class="token-in">In: ${totalIn.toLocaleString()}</span>
               <span class="token-out">Out: ${totalOut.toLocaleString()}</span>
               ${totalCache > 0 ? `<span class="token-cache">Cache: ${totalCache.toLocaleString()}</span>` : ''}
               <span style="color:#ccc;">Total: ${totalUsed.toLocaleString()}</span>
               <span class="cost-label">≈ $${lifetime}</span>
             </div>`
          : '';
        const ipLabel = k.boundIp
          ? `<span style="color:#4aff9e;">🔒 Locked to IP: ${escapeHtml(k.boundIp)}</span>`
          : `<span style="color:#666;">🔓 IP: Unbound — locks on first request</span>`;
        const refillLabelHtml = k.hasRefill && k.tokensRefillAt
          ? `<div class="refill-label">🔄 Refills ${refillIntervalLabel} · next: ${new Date(k.tokensRefillAt).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' })} IST</div>`
          : '';
        return `
        <div class="key-item">
          <div class="key-info">
            <div class="key-name">${escapeHtml(k.name)}</div>
            <div class="key-ip">${ipLabel}</div>
            <div class="key-meta">Expires: ${new Date(k.expiresAt).toLocaleDateString('en-GB')}  ·  ${tokenText}</div>
            ${limit > 0 ? `<div class="token-bar-wrap"><div class="token-bar ${barClass}" style="width:${pct}%"></div></div>` : ''}
            ${breakdown}
            ${lifetimeBreakdown}
            ${refillLabelHtml}
            <div class="key-value">${k.apiKey}</div>
          </div>
          <div class="actions">
            <button class="btn-secondary" onclick="copyKey('${k.apiKey}')">Copy</button>
            <button class="btn-secondary" onclick="copyEnv('${k.apiKey}')">Copy Env</button>
            <button class="btn-secondary" onclick="copyScript('${k.apiKey}')">Copy Script</button>
            <button class="btn-secondary" onclick="toggleEditLimit('${k.apiKey}')">Edit Limit</button>
            <button class="btn-secondary" onclick="toggleRefill('${k.apiKey}', ${k.hasRefill}, '${k.refillInterval}')" style="${k.hasRefill ? 'color:#4aff9e' : ''}">${k.hasRefill ? `Refill ${k.refillInterval === 'daily' ? 'Daily' : '5h'}` : 'Refill OFF'}</button>
            <button class="btn-secondary" onclick="resetTokens('${k.apiKey}')">Reset Tokens</button>
            <button class="btn-secondary" onclick="resetIp('${k.apiKey}')">Reset IP</button>
            <button class="btn-secondary" onclick="toggleHistory('${k.apiKey}')">History</button>
            <button class="btn-danger" onclick="revokeKey('${k.apiKey}')">Revoke</button>
          </div>
          <div id="edit-limit-${k.apiKey}" class="edit-limit-row hidden">
            <input type="number" id="limit-input-${k.apiKey}" value="${limit}" min="0" placeholder="0 = unlimited">
            <button class="btn-primary" onclick="saveLimit('${k.apiKey}')">Save</button>
            <button class="btn-secondary" onclick="toggleEditLimit('${k.apiKey}')">Cancel</button>
          </div>
          <div id="history-${k.apiKey}" class="history-panel hidden">
            <div class="hist-title">📋 Window History (last 50)</div>
            <div id="history-rows-${k.apiKey}"><em style="color:#555;">Loading...</em></div>
          </div>
        </div>`;
      }).join('');
    }

    async function createKey() {
      const name = document.getElementById('key-name').value || 'api-key';
      const days = parseInt(document.getElementById('key-days').value) || 7;
      const tokenLimit = parseInt(document.getElementById('key-token-limit').value) || 0;
      const refillSelect = document.getElementById('key-refill').value;
      const enableRefill = refillSelect !== 'none';
      const refillInterval = enableRefill ? refillSelect : '5h';
      const data = await api('POST', '/admin/create', { name, days, tokenLimit, enableRefill, refillInterval });
      if (data.error) {
        showAlert(data.error, 'error');
        return;
      }
      showAlert(`Key created: ${data.apiKey}`, 'success');
      loadKeys();
    }

    /**
     * Claude Sonnet 4.6 Anthropic API pricing (as of Sep 2026):
     *   Input:      $3.00 / M tokens
     *   Output:    $15.00 / M tokens
     *   Cache read:  $0.30 / M tokens  (used for cache_tokens — est. lower bound)
     */
    function calcCost(input, output, cache) {
      const cost = (input * 3.00 + output * 15.00 + cache * 0.30) / 1_000_000;
      if (cost < 0.0001) return '< 0.0001';
      if (cost < 0.01) return cost.toFixed(4);
      if (cost < 1) return cost.toFixed(3);
      return cost.toFixed(2);
    }

    async function revokeKey(apiKey) {
      if (!confirm('Revoke this key?')) return;
      await api('POST', '/admin/revoke', { apiKey });
      loadKeys();
    }

    async function resetTokens(apiKey) {
      if (!confirm('Reset token count to 0?')) return;
      await api('POST', '/admin/reset-tokens', { apiKey });
      loadKeys();
    }

    async function resetIp(apiKey) {
      if (!confirm('Reset IP binding for this key? The next request will lock to its new IP address.')) return;
      await api('POST', '/admin/reset-ip', { apiKey });
      showAlert('IP binding reset', 'success');
      loadKeys();
    }

    async function toggleHistory(apiKey) {
      const panel = document.getElementById(`history-${apiKey}`);
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        await loadHistory(apiKey);
      } else {
        panel.classList.add('hidden');
      }
    }

    async function loadHistory(apiKey) {
      const rowsEl = document.getElementById(`history-rows-${apiKey}`);
      const data = await api('GET', `/admin/history/${apiKey}`);
      if (data.error || !data.history) {
        rowsEl.innerHTML = '<em style="color:#555;">Failed to load history.</em>';
        return;
      }
      if (data.history.length === 0) {
        rowsEl.innerHTML = '<em style="color:#555;">No completed windows yet. Data appears here after the first refill cycle.</em>';
        return;
      }
      const fmt = iso => {
        const d = new Date(iso);
        return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      };
      rowsEl.innerHTML = data.history.map(h => {
        const cost = calcCost(h.inputTokens, h.outputTokens, h.cacheTokens);
        const label = h.windowType === 'daily' ? '24h' : '5h';
        return `<div class="history-row">
          <span class="hist-win">${fmt(h.windowStart)} → ${fmt(h.windowEnd)}</span>
          <span style="color:#555; font-size:0.72rem;">[${label}]</span>
          <span class="hist-in">In: ${h.inputTokens.toLocaleString()}</span>
          <span class="hist-out">Out: ${h.outputTokens.toLocaleString()}</span>
          ${h.cacheTokens > 0 ? `<span class="hist-cache">Cache: ${h.cacheTokens.toLocaleString()}</span>` : ''}
          <span style="color:#aaa;">Total: ${h.tokensUsed.toLocaleString()}</span>
          <span class="hist-cost">≈ $${cost}</span>
        </div>`;
      }).join('');
    }

    async function toggleRefill(apiKey, currentlyEnabled, currentInterval) {
      let enable, refillInterval;
      if (!currentlyEnabled) {
        const choice = prompt('Refill interval:\n  5h  — every 5 hours IST\n  daily — 00:00 IST\n\nType 5h or daily:');
        if (!choice) return;
        if (!['5h', 'daily'].includes(choice.trim())) { showAlert('Invalid interval. Use 5h or daily.', 'error'); return; }
        enable = true;
        refillInterval = choice.trim();
      } else {
        enable = false;
        refillInterval = currentInterval || '5h';
      }
      const data = await api('POST', '/admin/update-refill', { apiKey, enable, refillInterval });
      if (data.error) { showAlert(data.error, 'error'); return; }
      showAlert(enable ? `Refill enabled (${refillInterval})` : 'Refill disabled', 'success');
      loadKeys();
    }

    function toggleEditLimit(apiKey) {
      const row = document.getElementById(`edit-limit-${apiKey}`);
      row.classList.toggle('hidden');
    }

    async function saveLimit(apiKey) {
      const val = parseInt(document.getElementById(`limit-input-${apiKey}`).value) || 0;
      const data = await api('POST', '/admin/update-token-limit', { apiKey, tokenLimit: val });
      if (data.error) { showAlert(data.error, 'error'); return; }
      showAlert('Token limit updated', 'success');
      loadKeys();
    }

    function copyKey(key) {
      navigator.clipboard.writeText(key);
      showAlert('Copied to clipboard', 'success');
    }

    function copyEnv(key) {
      const baseUrl = window.location.origin;
      const text = JSON.stringify({
        env: {
          ANTHROPIC_API_KEY: key,
          ANTHROPIC_BASE_URL: baseUrl,
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        },
        model: "claude-sonnet-4-6"
      }, null, 2);
      navigator.clipboard.writeText(text);
      showAlert('Env JSON copied', 'success');
    }

    function copyScript(key) {
      const baseUrl = window.location.origin;
      const text = `if not exist "%USERPROFILE%\\.claude" mkdir "%USERPROFILE%\\.claude"\r\n(\r\necho {\r\necho   "env": {\r\necho     "ANTHROPIC_API_KEY": "${key}",\r\necho     "ANTHROPIC_BASE_URL": "${baseUrl}",\r\necho     "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"\r\necho   },\r\necho   "model": "claude-sonnet-4-6"\r\necho }\r\n) > "%USERPROFILE%\\.claude\\settings.json"`;
      navigator.clipboard.writeText(text);
      showAlert('Script copied', 'success');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    if (adminToken) {
      api('GET', '/admin/keys').then(data => {
        if (!data.error) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
          loadKeys();
        }
      });
    }
  </script>
</body>

</html>
